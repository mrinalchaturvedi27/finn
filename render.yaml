# Render blueprint: FINN API (seeded historical snapshot). Free plan sleeps and has ephemeral disk;
# each restart rebuilds from the image's seeded database. Singapore is the closest region to NSE.
services:
  - type: web
    name: finn-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FINN_CORS
        sync: false   # set to the Vercel origin, e.g. https://finn-xyz.vercel.app
