# Render blueprint: FINN API (seeded historical snapshot). Free plan sleeps and has ephemeral disk;
# each restart rebuilds from the image's seeded database. Singapore is the closest region to NSE.
services:
  - type: web
    name: finn-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FINN_CORS
        sync: false   # set to the Vercel origin, e.g. https://finn-xyz.vercel.app
      # Live data: the hosted Postgres the GitHub Actions worker writes to. Unset = the seeded
      # snapshot baked into the image. Secret: set in the dashboard, never in this file.
      - key: FINN_DB_URL
        sync: false
      - key: FINN_SCHEDULE_NOTE
        value: "worker scheduled hourly via GitHub Actions (best effort: runs can be delayed or skipped)"
      - key: FINN_READ_ONLY
        value: "1"    # PUT /api/settings refused; CORS alone doesn't stop direct calls
      # Runs probe/source_probe.py inside the running container at startup (free plan has no shell
      # or jobs); report to logs and GET /api/probe-report. Off: captured 2026-11-03 as
      # probe/report-render.json. Set to "1" to re-run.
      - key: FINN_STARTUP_PROBE
        value: "0"
      - key: FINN_PROBE_TIMEOUT
        value: "600"
