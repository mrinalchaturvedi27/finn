# Schema migrations for the hosted database: run manually, never as a side effect of a tick.
name: migrate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: finn-worker  # never alongside a worker tick
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migrate and verify
        working-directory: backend
        env:
          FINN_DB_URL: ${{ secrets.FINN_DB_URL }}
        run: |
          if [ -z "$FINN_DB_URL" ]; then echo "::error::repository secret FINN_DB_URL is not set"; exit 1; fi
          python -m finn.migrate
          python -m finn.migrate --status | tee -a "$GITHUB_STEP_SUMMARY"
